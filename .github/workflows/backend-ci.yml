
name: Backend CI

on:
  push:
    branches:
      - main
      - feature/**
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore dependencies
        run: dotnet restore backend/EmployeeManagement.sln

      - name: Build application
        run: dotnet build backend/EmployeeManagement.sln --no-restore

      - name: Run tests
        run: dotnet test backend/EmployeeManagement.sln --no-build
